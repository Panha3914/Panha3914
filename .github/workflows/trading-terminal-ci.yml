name: trading-terminal-ci

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "trading-terminal/**"
      - ".github/workflows/trading-terminal-ci.yml"
  pull_request:
    paths:
      - "trading-terminal/**"
      - ".github/workflows/trading-terminal-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-terminal/pyproject.toml
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check src tests
