[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdt-tui-trading-terminal"
version = "0.1.0"
description = "Safe-by-default MT5/XAUUSD TUI trading terminal scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.2", "textual>=0.70"]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
telegram = ["python-telegram-bot>=21.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
trading-terminal = "trading_terminal.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
